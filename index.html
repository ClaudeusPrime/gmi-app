<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMI Travel — Scheduling System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root {
  --navy:#1A3A6B;--navy-dark:#0F2347;--blue:#2E5EA3;--blue-light:#E6F1FB;
  --green:#1A7A3C;--green-light:#E6F5EC;--red:#B91C1C;--red-light:#FEE2E2;
  --amber:#B45309;--amber-light:#FEF3C7;--gray:#F8F9FA;--white:#FFFFFF;
  --border:#E2E8F0;--text:#1A202C;--text-muted:#64748B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--gray);color:var(--text);min-height:100vh}

/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy-dark)}
.login-card{background:var(--white);border-radius:16px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo svg{width:80px;height:80px}
.login-logo h1{color:var(--navy-dark);font-size:22px;font-weight:700;margin-top:10px}
.login-logo p{color:var(--text-muted);font-size:13px;margin-top:4px}
.login-form input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;font-family:Arial,sans-serif}
.login-form input:focus{border-color:var(--blue)}
.login-btn{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:Arial,sans-serif}
.login-btn:hover{background:var(--navy-dark)}
.login-error{color:var(--red);font-size:12px;margin-bottom:10px;text-align:center}

/* ── App Shell ── */
#app-screen{display:none;min-height:100vh}
.app{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{width:220px;background:var(--navy-dark);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sidebar-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-logo svg{width:100%;max-height:80px}
.sidebar-nav{padding:8px 0;flex:1}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.4)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.8);border-radius:0;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,0.1)}
.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1)}
.user-info{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:8px}
.user-name{font-weight:600;color:#fff;font-size:13px}
.user-role{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.5)}
.signout-btn{width:100%;padding:7px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:12px;cursor:pointer;font-family:Arial,sans-serif}
.signout-btn:hover{background:rgba(255,255,255,0.2)}

/* ── Main ── */
.main{margin-left:220px;flex:1;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:700;color:var(--navy-dark)}
.content{padding:1.5rem 2rem}

/* ── Cards ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:1.25rem;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 1.25rem;border-bottom:1px solid var(--border);background:var(--white)}
.card-title{font-size:15px;font-weight:700;color:var(--navy-dark)}
.card-body{padding:1.25rem}

/* ── Panels ── */
.panel{display:none}.panel.active{display:block}

/* ── Buttons ── */
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:var(--white);font-family:Arial,sans-serif;transition:all .15s}
.btn:hover{background:var(--gray)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:var(--navy-dark)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{color:var(--red);border-color:var(--red-light)}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pending{background:var(--amber-light);color:var(--amber)}
.badge-approved{background:var(--green-light);color:var(--green)}
.badge-declined{background:var(--red-light);color:var(--red)}
.badge-upcoming{background:var(--blue-light);color:var(--blue)}
.badge-admin{background:var(--navy);color:#fff}
.badge-minister{background:var(--blue-light);color:var(--blue)}
.badge-overseer{background:var(--amber-light);color:var(--amber)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--text-muted);background:var(--gray);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray)}

/* ── Forms ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:Arial,sans-serif;background:var(--white);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:80px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.25rem;text-align:center}
.stat-number{font-size:32px;font-weight:700;color:var(--navy-dark)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px}

/* ── Schedule ── */
.weekend-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.weekend-date{width:80px;flex-shrink:0;font-size:12px;font-weight:600;color:var(--navy-dark)}
.weekend-year{font-size:10px;color:var(--text-muted);margin-top:2px}
.weekend-visits{flex:1;display:flex;flex-direction:column;gap:6px}
.visit-row{background:var(--gray);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.visit-assembly{font-weight:600;color:var(--navy-dark)}
.visit-ministers{color:var(--text-muted);font-size:12px}
.empty-weekend{color:var(--text-muted);font-size:12px;font-style:italic}

/* ── Toast ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy-dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ── Loading ── */
.loading{text-align:center;padding:3rem;color:var(--text-muted);font-size:14px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Availability grid ── */
.avail-cell{width:20px;height:20px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}

/* ── Proposal form ── */
.budget-preview{background:var(--gray);border-radius:8px;padding:14px;margin-top:12px}
.budget-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.budget-total{display:flex;justify-content:space-between;font-weight:700;padding-top:8px;border-top:1px solid var(--border);margin-top:8px}
</style>
</head>
<body>

<!-- APP SCREEN -->
<div id="app-screen">
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="38" cy="54" rx="22" ry="17" fill="#FFCF00"/>
          <ellipse cx="38" cy="36" rx="9" ry="11" fill="#FFCF00"/>
          <ellipse cx="44" cy="24" rx="13" ry="12" fill="#FFCF00"/>
          <ellipse cx="26" cy="56" rx="13" ry="7" fill="#F0BC00" transform="rotate(-15 26 56)"/>
          <ellipse cx="57" cy="48" rx="7" ry="4" fill="#F0BC00" transform="rotate(30 57 48)"/>

          <rect x="51" y="17" width="7" height="4" rx="2" fill="#2255AA" opacity="0.85"/>
          <line x1="49" y1="19" x2="50" y2="19" stroke="#1A1A1A" stroke-width="1.2"/>

<script>
const SUPABASE_URL = 'https://agwlzmaiewhhfjyvfnfu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnd2x6bWFpZXdoaGZqeXZmbmZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODczODUsImV4cCI6MjA5NTQ2MzM4NX0.JdFWl7WJNN8KkEvfkoTQP6S6d27wEkbzv8X8WkElJQI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var currentUser = null;
var currentProfile = null;
var currentPanel = 'dashboard';

// ── Auth ──────────────────────────────────────────────────
async function signIn() {
  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-password').value;
  var errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Please enter email and password'; errEl.style.display = 'block'; return; }
  var btn = document.querySelector('.login-btn');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  var { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
  btn.textContent = 'Sign in'; btn.disabled = false;
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  await loadApp(data.user);
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function loadApp(user) {
  currentUser = user;
  // Load profile
  var { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!profile) {
    // Create default profile if missing
    await sb.from('profiles').insert({ id: user.id, full_name: user.email, role: 'minister' });
    profile = { id: user.id, full_name: user.email, role: 'minister' };
  }
  currentProfile = profile;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-name-display').textContent = profile.full_name;
  document.getElementById('user-role-display').textContent = profile.role.charAt(0).toUpperCase() + profile.role.slice(1);
  buildNav();
  showPanel('dashboard');
}

// ── Navigation ────────────────────────────────────────────
function buildNav() {
  var role = currentProfile.role;
  var nav = '';

  // All roles see dashboard and their schedule
  nav += navItem('dashboard', 'Dashboard', iconGrid());
  nav += '<div class="nav-section">Schedule</div>';
  nav += navItem('my-schedule', 'My Schedule', iconCalendar());
  nav += navItem('availability', 'My Availability', iconCheck());

  if (role === 'admin') {
    nav += navItem('full-schedule', 'Full Schedule', iconCalendar());
    nav += navItem('avail-grid', 'Availability Grid', iconGrid());
    nav += '<div class="nav-section">People</div>';
    nav += navItem('ministers', 'Ministers', iconUser());
    nav += navItem('assemblies', 'Assemblies', iconBuilding());
    nav += '<div class="nav-section">Records</div>';
    nav += navItem('church-reports', 'Church Reports', iconDoc());
    nav += '<div class="nav-section">Admin</div>';
    nav += navItem('settings', 'Settings', iconSettings());
    nav += navItem('budget', 'Travel Budget', iconDollar());
  }

  // All roles see proposals
  nav += '<div class="nav-section">Proposals</div>';
  nav += navItem('proposals', 'Travel Proposals', iconMsg());

  if (role === 'admin') {
    nav += navItem('users', 'User Management', iconUser());
  }

  document.getElementById('sidebar-nav').innerHTML = nav;
}

function navItem(id, label, icon) {
  return '<div class="nav-item" id="nav-'+id+'" onclick="showPanel(\''+id+'\')">' + icon + label + '</div>';
}

function showPanel(id) {
  currentPanel = id;
  var titles = {
    'dashboard':'Dashboard','my-schedule':'My Schedule','availability':'My Availability',
    'full-schedule':'Full Schedule','avail-grid':'Availability Grid',
    'ministers':'Ministers','assemblies':'Assemblies','church-reports':'Church Reports',
    'settings':'Settings','budget':'Travel Budget','proposals':'Travel Proposals',
    'users':'User Management'
  };
  document.getElementById('topbar-title').textContent = titles[id] || id;
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var navEl = document.getElementById('nav-'+id);
  if (navEl) navEl.classList.add('active');
  renderPanel(id);
}

async function renderPanel(id) {
  var content = document.getElementById('main-content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading...</div>';
  if (id === 'dashboard') await renderDashboard();
  else if (id === 'my-schedule') await renderMySchedule();
  else if (id === 'availability') await renderAvailability();
  else if (id === 'full-schedule') await renderFullSchedule();
  else if (id === 'proposals') await renderProposals();
  else if (id === 'ministers') await renderMinisters();
  else if (id === 'assemblies') await renderAssemblies();
  else if (id === 'users') await renderUsers();
  else if (id === 'church-reports') await renderChurchReports();
  else if (id === 'budget') await renderBudget();
  else if (id === 'settings') await renderSettings();
  else content.innerHTML = '<div class="loading">Coming soon</div>';
}

// ── Dashboard ─────────────────────────────────────────────
async function renderDashboard() {
  var role = currentProfile.role;
  var mname = currentProfile.minister_name;
  var html = '';

  if (role === 'admin') {
    // Admin dashboard - system overview
    var [schedRes, propRes, minRes, asmRes] = await Promise.all([
      sb.from('schedule').select('*', { count:'exact', head:true }),
      sb.from('proposals').select('*', { count:'exact', head:true }).eq('status','Pending'),
      sb.from('ministers').select('*', { count:'exact', head:true }),
      sb.from('assemblies').select('*', { count:'exact', head:true })
    ]);
    html += '<div class="stats-grid">';
    html += statCard(minRes.count || 0, 'Ministers');
    html += statCard(asmRes.count || 0, 'Assemblies');
    html += statCard(schedRes.count || 0, 'Scheduled visits');
    html += statCard(propRes.count || 0, 'Pending proposals');
    html += '</div>';

    // Pending proposals
    var { data: pending } = await sb.from('proposals').select('*').eq('status','Pending').order('submitted_at', { ascending:false }).limit(5);
    if (pending && pending.length) {
      html += '<div class="card"><div class="card-header"><span class="card-title">Pending Proposals</span></div>';
      html += '<table><thead><tr><th>Minister</th><th>Assembly</th><th>Weekend</th><th>Cost</th><th></th></tr></thead><tbody>';
      pending.forEach(function(p){
        var sym = p.currency === 'CAD' ? 'CA$' : 'US$';
        html += '<tr><td><strong>'+p.minister+'</strong></td><td>'+p.assembly+'</td><td>'+p.weekend_label+'</td>';
        html += '<td>'+sym+(p.total_cost||0).toFixed(0)+'</td>';
        html += '<td><button class="btn btn-sm btn-green" onclick="approveProposal('+p.id+')">Approve</button> ';
        html += '<button class="btn btn-sm btn-red" onclick="declineProposal('+p.id+')">Decline</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }

  } else {
    // Minister dashboard
    if (mname) {
      var today = new Date().toISOString().split('T')[0];
      var { data: myVisits } = await sb.from('schedule').select('*')
        .or('m1.eq.'+mname+',m2.eq.'+mname+',m3.eq.'+mname+',m4.eq.'+mname)
        .gte('fri', today).order('fri').limit(5);

      html += '<div class="stats-grid">';
      html += statCard(myVisits ? myVisits.length : 0, 'Upcoming visits');
      html += '</div>';

      if (myVisits && myVisits.length) {
        html += '<div class="card"><div class="card-header"><span class="card-title">Your Upcoming Visits</span></div><div>';
        myVisits.forEach(function(s){
          var d = new Date(s.fri + 'T00:00:00');
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          var sat = new Date(d); sat.setDate(sat.getDate()+1);
          var sun = new Date(d); sun.setDate(sun.getDate()+2);
          var label = months[sat.getMonth()]+' '+sat.getDate()+'\u2013'+sun.getDate();
          html += '<div class="weekend-row"><div class="weekend-date">'+label+'<div class="weekend-year">'+d.getFullYear()+'</div></div>';
          html += '<div class="weekend-visits"><div class="visit-row"><span class="visit-assembly">'+s.assembly+'</span>';
          var mins = [s.m1,s.m2,s.m3,s.m4].filter(Boolean);
          html += '<span class="visit-ministers">'+mins.join(' \u00b7 ')+'</span></div></div></div>';
        });
        html += '</div></div>';

function renderScheduleRows(visits) {
  if (!visits.length) return '<div class="card-body" style="color:var(--text-muted)">No visits scheduled.</div>';
  var html = '';
  var lastFri = '';
  visits.forEach(function(s){
    if (s.fri !== lastFri) {
      if (lastFri) html += '</div></div>';
      var d = new Date(s.fri+'T00:00:00');
      var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var sat=new Date(d);sat.setDate(sat.getDate()+1);
      var sun=new Date(d);sun.setDate(sun.getDate()+2);
      var label=months[sat.getMonth()]+' '+sat.getDate()+'\u2013'+sun.getDate();
      html+='<div class="weekend-row"><div class="weekend-date">'+label+'<div class="weekend-year">'+d.getFullYear()+'</div></div><div class="weekend-visits">';
      lastFri = s.fri;
    }
    var mins=[s.m1,s.m2,s.m3,s.m4].filter(Boolean);
    var status=s.cancelled?'<span class="badge badge-declined">Cancelled</span>':s.visited?'<span class="badge badge-approved">Visited</span>':'';
    html+='<div class="visit-row"><span class="visit-assembly">'+s.assembly+'</span><span class="visit-ministers">'+mins.join(' \u00b7 ')+'</span>'+status+'</div>';
  });
  if (lastFri) html += '</div></div>';
  return html;
}

function pfUpdate() {
  var mSel = document.getElementById('pf-minister');
  var mode = document.getElementById('pf-mode').value;
  var distLabel = document.getElementById('pf-dist-label');
  if (!mSel) return;
  var opt = mSel.options[mSel.selectedIndex];
  var country = opt ? (opt.getAttribute('data-country')||'CAN') : 'CAN';
  var unit = country==='USA'?'mi':'km';
  if (distLabel) distLabel.textContent = mode==='fly' ? 'Flight cost ($)' : 'Distance ('+unit+')';
  pfBudget();
}

function pfBudget() {
  var mSel = document.getElementById('pf-minister');
  if (!mSel) return;
  var opt = mSel.options[mSel.selectedIndex];
  var country = opt ? (opt.getAttribute('data-country')||'CAN') : 'CAN';
  var mode = document.getElementById('pf-mode').value;
  var dist = parseFloat(document.getElementById('pf-distance').value)||0;
  var nights = parseFloat(document.getElementById('pf-nights').value)||0;
  var days = parseFloat(document.getElementById('pf-days').value)||0;
  var unit = country==='USA'?'mi':'km';
  var mileage = country==='CAN'?0.55:0.65;
  var hotelRate = country==='CAN'?130:110;
  var mealRate = country==='CAN'?65:55;
  var cur = country==='CAN'?'CAD':'USD';
  var sym = cur==='CAD'?'CA$':'US$';
  var fmt = function(n){return sym+n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');};
  if (!dist || !mSel.value) { document.getElementById('pf-budget').style.display='none'; return; }
  var transport = mode==='fly' ? dist : dist*mileage*2;
  var hotel = nights*hotelRate;
  var meals = days*mealRate;
  var total = transport+hotel+meals;
  var html = '<div style="font-weight:600;margin-bottom:8px">Estimated Budget ('+cur+')</div>';
  html += '<div class="budget-line"><span>'+(mode==='fly'?'Flight cost':'Driving ('+dist+' '+unit+' return @ '+mileage+'/'+unit+')')+'</span><span>'+fmt(transport)+'</span></div>';
  html += '<div class="budget-line"><span>Hotel ('+nights+' nights @ '+fmt(hotelRate)+'/night)</span><span>'+fmt(hotel)+'</span></div>';
  html += '<div class="budget-line"><span>Meals ('+days+' days @ '+fmt(mealRate)+'/day)</span><span>'+fmt(meals)+'</span></div>';
  html += '<div class="budget-total"><span>Total estimate</span><span>'+fmt(total)+'</span></div>';
  document.getElementById('pf-budget').innerHTML = html;
  document.getElementById('pf-budget').style.display = 'block';
  window._pfBudget = {transport:transport,hotel:hotel,meals:meals,total:total,currency:cur,mode:mode,dist:dist,unit:unit,nights:nights,days:days};
}

async function submitProposal() {
  var mSel = document.getElementById('pf-minister');
  var minister = mSel ? mSel.value : '';
  var assembly = document.getElementById('pf-assembly').value;
  var weekend = document.getElementById('pf-weekend').value;
  var purpose = document.getElementById('pf-purpose').value;
  var plurality = document.getElementById('pf-plurality').value;
  var spouse = document.getElementById('pf-spouse').value === 'yes';
  var notes = document.getElementById('pf-notes').value;
  var mode = document.getElementById('pf-mode').value;
  if (!minister||!assembly||!weekend||!purpose) { showToast('Please fill in all required fields'); return; }
  var budget = window._pfBudget || {total:0,currency:'CAD'};
  var wkLabel = '';
  var allWk = getWeekends();
  for (var i=0;i<allWk.length;i++){if(allWk[i].fri===weekend){wkLabel=allWk[i].label+' ('+allWk[i].year+')';break;}}
  // Get overseers from selected minister option
  var opt = mSel.options[mSel.selectedIndex];
  var overseers = opt ? (opt.getAttribute('data-overseers')||'') : '';
  var overseerLines = overseers.trim() ? overseers.trim().split('\n').map(function(l){return l.trim();}).filter(Boolean) : [];
  var sym = budget.currency==='CAD'?'CA$':'US$';
  var fmt = function(n){return sym+(n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');};
  var text = 'TRAVEL PROPOSAL\n================\n\n';
  text += 'Minister:    '+minister+'\n';
  text += 'Assembly:    '+assembly+'\n';
  text += 'Weekend:     '+wkLabel+'\n';
  text += 'Purpose:     '+purpose+'\n';
  text += 'Mode:        '+(mode==='fly'?'Flying':'Driving')+'\n';
  text += 'Plurality:   '+(plurality?'Travelling with '+plurality:'Travelling alone')+'\n';
  text += 'With spouse: '+(spouse?'Yes':'No')+'\n\n';
  text += 'ESTIMATED BUDGET ('+budget.currency+')\n---------------------------\n';
  text += (mode==='fly'?'Flight cost:  ':'Driving:      ')+fmt(budget.transport)+'\n';
  text += 'Hotel:        '+fmt(budget.hotel)+'\n';
  text += 'Meals:        '+fmt(budget.meals)+'\n';
  text += 'TOTAL:        '+fmt(budget.total)+'\n';
  if (notes) text += '\nNOTES\n-----\n'+notes+'\n';
  text += '\nSEND TO\n-------\n'+(overseerLines.length?overseerLines.join('\n'):'No overseers on file — please contact administrator');
  text += '\n\nSubmitted: '+new Date().toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'});
  var { error } = await sb.from('proposals').insert({
    minister:minister, assembly:assembly, weekend:weekend, weekend_label:wkLabel,
    purpose:purpose, plurality:plurality, spouse:spouse, mode:mode,
    distance:budget.dist||0, distance_unit:budget.unit||'km',
    flight_cost:mode==='fly'?budget.transport:0,
    hotel_nights:budget.nights||0, meal_days:budget.days||0,
    transport_cost:budget.transport||0, hotel_cost:budget.hotel||0,
    meal_cost:budget.meals||0, total_cost:budget.total||0,
    currency:budget.currency, notes:notes, overseers:overseerLines.join('\n'),
    status:'Pending', proposal_text:text
  });
  if (error) { showToast('Error saving proposal: '+error.message); return; }
  window._lastProposalText = text;
  document.getElementById('pf-text').value = text;
  document.getElementById('pf-result').style.display = 'block';
  if (navigator.clipboard) { navigator.clipboard.writeText(text); }
  showToast('Proposal saved and copied');
  renderProposals();
}

function copyLastProposal() {
  var text = document.getElementById('pf-text').value;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){showToast('Copied');});
}

function copyProposalText(id, text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text||'').then(function(){showToast('Copied');});
}

function pfClear() {
  ['pf-minister','pf-assembly','pf-weekend','pf-purpose','pf-mode','pf-plurality','pf-spouse'].forEach(function(id){
    var el=document.getElementById(id); if(el&&!el.disabled) el.value='';
  });
  ['pf-distance','pf-nights','pf-days','pf-notes'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('pf-budget').style.display='none';
  document.getElementById('pf-result').style.display='none';
}

async function declineProposal(id) {

async function resetProposal(id) {

function showMinisterForm() {
  document.getElementById('minister-form-area').style.display='block';
  document.getElementById('mf-id').value='';
  ['mf-first','mf-last','mf-city','mf-email','mf-phone','mf-overseers','mf-notes'].forEach(function(id){document.getElementById(id).value='';});
}

function editMinister(m) {
  document.getElementById('minister-form-area').style.display='block';
  var parts = (m.name||'').split(' ');
  document.getElementById('mf-first').value = parts[0]||'';
  document.getElementById('mf-last').value = parts.slice(1).join(' ')||'';
  document.getElementById('mf-city').value = m.city||'';
  document.getElementById('mf-country').value = m.country||'CAN';
  document.getElementById('mf-region').value = m.region||'CANPR';
  document.getElementById('mf-email').value = m.email||'';
  document.getElementById('mf-phone').value = m.phone||'';
  document.getElementById('mf-overseers').value = m.overseers||'';
  document.getElementById('mf-notes').value = m.notes||'';
  document.getElementById('mf-id').value = m.id||'';
}

async function saveMinister() {
  var first = document.getElementById('mf-first').value.trim();
  var last = document.getElementById('mf-last').value.trim();
  if (!first||!last) { showToast('Please enter first and last name'); return; }
  var name = first+' '+last;
  var data = {
    name:name, first_name:first, last_name:last,
    city:document.getElementById('mf-city').value,
    country:document.getElementById('mf-country').value,
    region:document.getElementById('mf-region').value,
    email:document.getElementById('mf-email').value,
    phone:document.getElementById('mf-phone').value,
    overseers:document.getElementById('mf-overseers').value,
    notes:document.getElementById('mf-notes').value
  };
  var id = document.getElementById('mf-id').value;
  if (id) {
    await sb.from('ministers').update(data).eq('id', id);
  } else {
    await sb.from('ministers').insert(data);
  }
  showToast('Minister saved');
  renderMinisters();
}

function editUser(id, name, role, ministerName) {

}

function getWeekends() {
  var out = [];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  [2026,2027,2028,2029,2030].forEach(function(year){
    var d = new Date(year,0,1);
    while(d.getFullYear()===year){
      if(d.getDay()===5){
        var fri=new Date(d);
        var sat=new Date(d);sat.setDate(sat.getDate()+1);
        var sun=new Date(d);sun.setDate(sun.getDate()+2);
        var label=months[sat.getMonth()]+' '+sat.getDate()+'\u2013';
        if(sun.getMonth()!==sat.getMonth())label+=months[sun.getMonth()]+' ';
        label+=sun.getDate();
        out.push({fri:fri.toISOString().split('T')[0],label:label,year:year});
      }
      d.setDate(d.getDate()+1);
    }
  });
  return out;
}
